name: Radar CNPJ MCP Server
description: Official hosted MCP server for Radar CNPJ (Streamable HTTP, JSON-RPC 2.0). GET /mcp returns
  a server card; POST /mcp answers initialize, tools/list and tools/call with no authentication. Every
  tool is a thin binding onto the same public REST API (the MCP has no backend of its own); credentials
  (x-radar-session, Authorization, X-PAYMENT) are passed through as headers, and exhausted quotas surface
  as HTTP 402 x402 accepts[] inside the tool result. Advertised in the RFC 9727 api-catalog linkset and
  llms.txt, with an MCP-registry ed25519 key published at /.well-known/mcp-registry-auth.
