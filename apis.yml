name: Radar CNPJ
description: Brazilian company-data service built on the Receita Federal CNPJ registry. Paste a business idea in
  plain text to see how many companies already operate in that space, plus CNPJ lookup, advanced search, geolocation,
  and change-monitoring. Explicitly agent-first, shipping a full stack of machine-readable discovery artifacts including
  OpenAPI, a hosted MCP server, and llms.txt.
