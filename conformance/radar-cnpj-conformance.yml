domain_standard:
  note: >-
    The service is built on the Receita Federal CNPJ registry and returns official Brazilian
    government vocabularies — CNAE activity codes, IBGE municipality codes and natureza juridica
    codes via GET /api/ref, and CNEFE neighborhood data via GET /api/municipio-proximo. These are
    the identifier schemes of its market (Brazilian company data) carried in the contract itself
    (Empresa.cnae, ItemReferencia.codigo). No formal API-shape standard (e.g. OpenBanking Brasil)
    applies to this KYB/company-data market segment.
